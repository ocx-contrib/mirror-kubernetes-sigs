extends: ../mirror-base.yml

name: kind

# Logical index package `kubernetes-sigs/kind` at the physical path
# `ghcr.io/ocx-contrib/kubernetes-sigs/kind` — slash segments, never
# hyphen-flattened. The first segment must be this repo's own GitHub owner:
# GITHUB_TOKEN only authorises packages owned by the repo the workflow runs in.
#
# The namespace is the upstream org (`kubernetes-sigs`), which is also what
# this repository is named for — a SIG umbrella that publishes many tools, so
# it groups rather than names any one of them.
target:
  registry: ghcr.io
  repository: ocx-contrib/kubernetes-sigs/kind

source:
  type: github_release
  owner: kubernetes-sigs
  repo: kind
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# kind is a pure-Go, cgo-free binary, so upstream ships ONE Linux build per
# arch and it is fully static. Measured on the v0.32.0 assets:
#
#   $ file kind-linux-amd64
#   ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked,
#   stripped
#   $ readelf -l kind-linux-amd64 | grep -c INTERP   → 0
#   $ readelf -d kind-linux-amd64 | grep -c NEEDED   → 0
#   $ strings -a kind-linux-amd64 | grep -c '^UPX'   → 0
#
#   $ file kind-linux-arm64
#   ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV), statically
#   linked, stripped
#   $ readelf -l kind-linux-arm64 | grep -c INTERP   → 0
#   $ readelf -d kind-linux-arm64 | grep -c NEEDED   → 0
#   $ strings -a kind-linux-arm64 | grep -c '^UPX'   → 0
#
# No PT_INTERP, no DT_NEEDED, and no UPX stub to make a packed binary merely
# LOOK static: the artifact requires nothing of the host userland, so both
# Linux keys are BARE. `os.features` states what the artifact REQUIRES, so
# tagging a static build `+libc.musl` would be a false requirement that hid it
# from every glibc host. Upstream publishes no musl/gnu split, so there is no
# second key to weigh. The `alpine:3.20` container leg below is what turns the
# universal claim into evidence.
#
# ─── Scope (verified BOTH ways on v0.30.0, v0.31.0 and v0.32.0 — the whole
#     in-range set) ─────────────────────────────────────────────────────────
#
#   $ gh api repos/kubernetes-sigs/kind/releases/tags/<tag> --jq '.assets[].name'
#
# returns the SAME ten names on all three: five platform binaries and their
# five `.sha256sum` sidecars. Every pattern below matched EXACTLY ONE asset on
# every in-range release. A pattern matching zero is SILENTLY SKIPPED, not an
# error — that is the failure this check exists to catch.
#
# ⚠️ ASSET FILENAMES CARRY NO VERSION TOKEN. `kind-linux-amd64` is the
# byte-identical NAME in v0.30.0 and v0.32.0; the version lives only in the
# release tag and the download URL. So these patterns are fully literal, with
# no `.*` version hole to leak into a neighbouring arch — and because there is
# no version token, the "upstream shipped the previous release's binaries under
# a new tag" trap (vivid) cannot be detected from names here; the `$` anchor is
# what keeps the `.sha256sum` sidecars out.
#
# ⚠️ windows/arm64 IS NOT SHIPPED UPSTREAM and is deliberately NOT declared —
# see the commented line under `windows/amd64` below. Upstream's full asset
# list for every in-range release contains exactly one Windows binary,
# `kind-windows-amd64`. Declaring the arm64 key anyway would boot a
# `windows-11-arm` runner that resolves no asset, self-skips every version and
# reports SUCCESS having tested nothing.
assets:
  linux/amd64:
    - "^kind-linux-amd64$"
  linux/arm64:
    - "^kind-linux-arm64$"
  # ── PASS 2 (darwin) — LANDED ──────────────────────────────────────────────
  darwin/amd64:
    - "^kind-darwin-amd64$"
  darwin/arm64:
    - "^kind-darwin-arm64$"
  # ── PASS 3 (windows) ──────────────────────────────────────────────────────
  # windows/amd64:
  #   - "^kind-windows-amd64$"
  # windows/arm64: NOT DECLARED — upstream ships no windows/arm64 asset.
  #   Verified on v0.30.0, v0.31.0 and v0.32.0: the only Windows entry in each
  #   release is `kind-windows-amd64`. This is an evidenced exclusion, not an
  #   oversight; re-check it when upstream adds one.

asset_type:
  # RAW UNVERSIONED BINARIES — there is no archive layer at all. The downloaded
  # asset IS the executable, renamed to `kind` so one metadata file serves every
  # platform.
  #
  # ⚠️ THE WINDOWS OVERRIDE IS LOAD-BEARING, and it was decided by measurement,
  # not by assumption. `asset_type: binary` PRESERVES whatever suffix the
  # upstream asset name carries — it does not synthesise one. Upstream's
  # `kind-windows-amd64` has NO `.exe`, so without the override the bundle
  # ships a file literally named `kind`, which Windows PATHEXT resolution will
  # not execute. Measured locally with a windows-only temp spec, no runner:
  #
  #   name: kind      → $ tar tvf bundle.tar.xz
  #                     -rwxr-xr-x  10833920  kind          ← broken on Windows
  #   name: kind.exe  → $ tar tvf bundle.tar.xz
  #                     -rwxr-xr-x  10833920  kind.exe      ← correct
  #
  # Same class as direnv 2.37.0+, whose assets also dropped the suffix. A
  # raw-`.exe` upstream (osv-scanner) needs no override at all.
  #
  # The override entry stays here through passes 1–2 even though `windows/amd64`
  # is not yet in `assets:`/`platforms:` — it is inert until the platform is
  # declared, and keeping it makes PASS 3 a pure uncomment of the two blocks
  # that matter.
  default:
    type: binary
    name: kind
  platforms:
    windows/amd64:
      type: binary
      name: kind.exe

# `off`, and it cannot be otherwise. The scan only looks BELOW an
# interface-visible PATH entry of the form ${installPath}/<dir>; a raw-binary
# mirror has none — the executable IS the content root, so PATH is a bare
# ${installPath}. `auto`/`verify` is rejected at spec load with exit 65. `off`
# plus a hand-listed `binaries` in metadata.json is the blessed shape here, and
# that list is not decoration: GitHub serves raw release assets WITHOUT the
# exec bit, and `prepare` chmods 0755 only the binaries the metadata DECLARES.
bin_scan: off

metadata:
  default: metadata.json

catalog:
  # Resolves against THIS spec's directory (unlike `tests[].script`, which
  # resolves from the repository root).
  logo: logo.svg

versions:
  # 0.30.0 is the recon-assigned floor. All three in-range releases (0.30.0,
  # 0.31.0, 0.32.0) pass the both-ways platform check above, ship the same
  # five raw binaries, and share the CLI surface tests/smoke.star asserts
  # (`version`, `get clusters`, `create cluster --config` validation).
  min: "0.30.0"
  new_per_run: 5
  # Without this the generated workflow only fires on workflow_dispatch + push
  # and never auto-discovers a new upstream release. The minute is staggered
  # against this repo's other spec so they do not hit the releases API together.
  poll_interval: "37 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: kind/tests/smoke.star

# ─── Platform matrix — RESTATED IN FULL, not merged ─────────────────────────
#
# ../mirror-base.yml carries NO `platforms:` block, precisely so that this one
# cannot be a partial restatement of anything. Every key this spec declares
# appears below with its complete `containers:` list.
#
# Only PASS 1 (Linux) is live. A platform declared here but absent from
# `assets:` does NOT cost nothing: the generated test matrix is static, so the
# leg boots its runner, installs the toolchain, finds the platform missing from
# every version's resolved set, skips, and reports SUCCESS — macOS at 10× and
# Windows at 2× the minute rate to verify nothing. So the darwin/windows keys
# are commented out alongside their `assets:` keys and uncommented in the same
# edit, by hand (never by sed — a replacement rewrites `\\.` to `\.` inside an
# asset regex), followed by `generate ci` naming EVERY spec in this repository.
#
# libc evidence for the bare Linux keys is above `assets:`; the alpine leg is
# what makes the universal claim evidence rather than assertion.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  # ── PASS 2 (darwin) — LANDED ──────────────────────────────────────────────
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
    # native macos-13 Intel pool is exhausted and deadlocks the push job.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  # ── PASS 3 (windows) ──────────────────────────────────────────────────────
  # windows/amd64:
  #   runner: windows-latest
  #   shell: pwsh
  # windows/arm64: NOT DECLARED — no upstream asset (evidence above `assets:`).
  #
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.
  #
  # No `containers[].setup` anywhere: kind is a static binary that shells out
  # to a container runtime only when a cluster is actually created, and the
  # smoke test deliberately exercises only the runtime-free paths. `kind get
  # clusters` on a stock image with no docker/podman on PATH exits 0 with empty
  # stdout — measured, not assumed.

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/kubernetes-sigs/kind/license --jq '.license.spdx_id'
  #   Apache-2.0
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: kubernetes-sigs/kind
  fork: ocx-contrib/index
